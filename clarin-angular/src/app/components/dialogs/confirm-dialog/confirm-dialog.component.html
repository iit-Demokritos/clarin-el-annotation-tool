<div class="confirm-dialog-modal">
  <div class="confirm-dialog-{{data?.headerType}}-modal-header">
    <h1 mat-dialog-title>{{data?.dialogTitle|translate}}</h1>
  </div>
  <mat-dialog-content>
    <p [innerHTML]="data?.message"></p>
    <!--{{data?.message}}-->
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    @if (data?.showCancelButton) {
      <button mat-button (click)="cancel()">{{'Cancel'|translate}}</button>
    }
    @for (button of data?.buttons; track button) {
      <button mat-button (click)="confirm(button)">{{button|translate}}</button>
    }
  </mat-dialog-actions>
</div>
