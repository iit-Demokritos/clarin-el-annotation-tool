<div class="coref-annotate-btn">
  @if (showAnnotateBtn) {
    <button mat-stroked-button color="primary" (click)="addAnnotation()">{{'Annotate'|translate}}</button>
  }
  @if (!showAnnotateBtn) {
    <button mat-stroked-button color="primary" (click)="updateAnnotation()">{{'Update'|translate}}</button>
  }
</div>
