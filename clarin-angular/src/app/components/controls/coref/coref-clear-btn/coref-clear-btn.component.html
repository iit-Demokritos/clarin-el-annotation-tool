<div class="coref-clear-btn">
  @if (showClearBtn) {
    <button mat-stroked-button color="warn" (click)="resetInputFields()">{{'Clear'|translate}}</button>
  }
  @if (!showClearBtn) {
    <button mat-stroked-button color="warn" (click)="cancelSelectedAnnotation()">{{'Cancel'|translate}}</button>
  }
</div>
