<div class="annotation-relation-clear-btn">
  @if (showClearBtn) {
    <button mat-stroked-button color="warn" (click)="resetInputFields()">{{'Clear'|translate}}</button>
  }
  @if (!showClearBtn) {
    <button mat-stroked-button color="warn" (click)="resetInputFields()">{{'Cancel'|translate}}</button>
  }
</div>
