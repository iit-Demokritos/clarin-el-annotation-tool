@if (showPageHeader) {
  <page-header title="{{'Compare Documents'|translate}}"></page-header>
}
<div class="compare-documents" [ngClass]="{'has-page-header': showPageHeader, 'no-page-header': !showPageHeader}">
  <mat-card appearance="outlined" class="mat-card-fill-parent">
    <mat-card-header>
      <mat-card-subtitle>
        @if (showDocumentSelectionToolbar) {
          <toolbar-select-document
            [allowMultipleCollections]="allowMultipleCollections"
            [allowMultipleDocuments]="allowMultipleDocuments"
            (selectedCollections)="onCollectionsChange($event)"
            (selectedDocuments)="onDocumentsChange($event)"
            >
          </toolbar-select-document>
        }
      </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content class="main-content">
      <app-annotation-set-comparator
        [collections]="selectedCollection"
        [documents]="selectedDocument"
        [clearOnDocumentsChange]="clearOnDocumentsChange"
        >
      </app-annotation-set-comparator>
    </mat-card-content>
  </mat-card>
</div>
